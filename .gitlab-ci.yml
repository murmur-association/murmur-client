# Checks on every push: static analysis, the unit tests, and a web build.
# A version tag also releases (see "Releases" below), and a scheduled
# pipeline makes a release of its own when the testnet checkpoint has aged
# (see "The scheduled release").
# The Flutter version is pinned by FLUTTER_VERSION below; raise it
# deliberately, together with the version used locally.
stages:
- check
- test
- build
- package
- secret-detection
- deploy
- release

include:
- template: Security/SAST.gitlab-ci.yml
- template: Security/Secret-Detection.gitlab-ci.yml

variables:
  SECRET_DETECTION_ENABLED: 'true'
  # The Flutter SDK every job builds with (cloned at this tag, and cached).
  FLUTTER_VERSION: "3.47.5"
  # What building the Linux app needs, and what its tests need to run it
  # without a desktop: a display, a window manager, a session and a keyring.
  LINUX_APP_PACKAGES: >-
    clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev g++ libsecret-1-dev libjsoncpp-dev
    xvfb openbox wmctrl dbus dbus-x11 gnome-keyring libgl1-mesa-dri libegl1 libgles2 procps

# No merge request pipelines (pushes are checked as branch pipelines), and a
# scheduled pipeline holds the scheduled release alone: the scanners are
# switched off there, and the checks below leave themselves out.
workflow:
  rules:
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    when: never
  - if: $CI_PIPELINE_SOURCE == "schedule"
    variables:
      SAST_DISABLED: "true"
      SECRET_DETECTION_DISABLED: "true"
  - when: always

sast:
  stage: test
secret_detection:
  stage: secret-detection

.flutter:
  # A base system with Flutter's dependencies. The Flutter SDK itself is
  # pinned by FLUTTER_VERSION and cloned from the official repository (and
  # cached), since images aren't published for every release.
  image: ghcr.io/cirruslabs/flutter:3.44.0
  variables:
    PUB_CACHE: "$CI_PROJECT_DIR/.pub-cache"
  before_script:
  - |
    if [ "$(cat .flutter-sdk/.ci-version 2>/dev/null)" != "$FLUTTER_VERSION" ]; then
      rm -rf .flutter-sdk
      git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git .flutter-sdk
      echo "$FLUTTER_VERSION" > .flutter-sdk/.ci-version
    fi
  - export PATH="$CI_PROJECT_DIR/.flutter-sdk/bin:$PATH"
  - flutter --version
  - flutter pub get
  cache:
  - key: flutter-sdk-$FLUTTER_VERSION
    paths:
    - .flutter-sdk/
  - key:
      files:
      - pubspec.lock
    paths:
    - .pub-cache/

# The checks of every push and tag; not of a scheduled pipeline, where the
# scheduled release runs them itself on what it's about to publish.
.checks:
  rules:
  - if: $CI_PIPELINE_SOURCE == "schedule"
    when: never
  - when: on_success

analyze:
  extends:
  - .flutter
  - .checks
  stage: check
  script:
  # The generated localizations must match the ARB files.
  - flutter gen-l10n
  - git diff --exit-code -- lib/l10n
  - flutter analyze

test:
  extends:
  - .flutter
  - .checks
  stage: test
  variables:
    # The tests against the node must run here, not skip themselves.
    MURMUR_REQUIRE_NODE: "1"
  script:
  # The pinned murmur-node release (tool/node_release.dart), checked
  # against its SHA256SUMS, for the tests that start nodes on chains it
  # builds (test/node_test.dart). The public-node tests skip themselves
  # without MURMUR_NODE.
  - dart run tool/bundle_node.dart --for-tests
  - flutter test

# The acceptance tests: what a user does with the app (a wallet, a thread,
# a reply, an invitation card, a restart, a notification), inside the built
# app and against a node of its own on a demo chain. One test file
# (integration_test/acceptance_test.dart), run once per flavour by
# tool/acceptance_test.dart. Every job is named "acceptance: [<flavour>]",
# so the pipeline shows them as one group: here the Linux app (with its own
# node, and mining on a graphics card this runner doesn't have) and the
# browsers that run on Linux (pinned, tool/fetch_test_browser.dart): Chrome
# with a passphrase and with a passkey, and Firefox. New, so allowed to fail
# until it has run green here: it must not stop the scheduled release
# before then.
acceptance:
  extends:
  - .flutter
  - .checks
  stage: test
  allow_failure: true
  variables:
    MURMUR_REQUIRE_NODE: "1"
  parallel:
    matrix:
    - ACCEPTANCE_DEVICE: [linux, chrome, chrome-passkey, firefox]
  script:
  - apt-get update -qq
  # Firefox's archive is xz, and it plays (and so loads) sound.
  - DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends $LINUX_APP_PACKAGES libnss3 libgbm1 xz-utils
  - DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends libasound2t64 || DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends libasound2
  - dart run tool/bundle_node.dart --for-tests
  - case "$ACCEPTANCE_DEVICE" in chrome*) dart run tool/fetch_test_browser.dart chrome;; firefox) dart run tool/fetch_test_browser.dart firefox;; esac
  # The same session for all: the Linux app needs its display, and a
  # browser is none the worse for it.
  - tool/linux_session.sh flutter test tool/acceptance_test.dart

# The flavours that cost more (other runners, or an hour on this one): by
# themselves on the default branch and on tags, by hand elsewhere. New, so
# allowed to fail until they have run green.
.acceptance-costly:
  stage: test
  allow_failure: true
  rules:
  - if: $CI_PIPELINE_SOURCE == "schedule"
    when: never
  - if: $CI_COMMIT_TAG || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  - when: manual
  variables:
    MURMUR_REQUIRE_NODE: "1"

# GitLab's macOS runner, ready to build the app and run its tests: the
# pinned Flutter SDK (cloned and cached, as on Linux and Windows), the
# packages, and the pinned node's macOS build. For iOS and macOS.
.flutter-macos:
  image: macos-26-xcode-26
  tags:
  - saas-macos-medium-m1
  variables:
    PUB_CACHE: "$CI_PROJECT_DIR/.pub-cache"
  cache:
  - key: flutter-sdk-macos-$FLUTTER_VERSION
    paths:
    - .flutter-sdk-macos/
  before_script:
  - |
    if [ "$(cat .flutter-sdk-macos/.ci-version 2>/dev/null)" != "$FLUTTER_VERSION" ]; then
      rm -rf .flutter-sdk-macos
      git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git .flutter-sdk-macos
      echo "$FLUTTER_VERSION" > .flutter-sdk-macos/.ci-version
    fi
  - export PATH="$CI_PROJECT_DIR/.flutter-sdk-macos/bin:$PATH"
  - flutter --version
  - flutter pub get
  - dart run tool/bundle_node.dart --for-tests

# In an Android emulator, on GitLab's hosted Linux runner. The runner has
# no KVM, so the emulator emulates the processor (measured 2026-10-20: a
# boot in about three minutes, the whole job about 50), and the suite waits
# six times as long. The runner answers the system's screens from the host
# (tool/android_system.dart): the notification permission, a fingerprint
# enrolled and touched, a notification opened from the shade, the
# background job run as Android would.
"acceptance: [android]":
  extends:
  - .flutter
  - .acceptance-costly
  tags:
  - saas-linux-large-amd64
  timeout: 3h
  variables:
    # Every instruction emulated: a passphrase's 600,000 rounds of PBKDF2
    # take minutes, so the suite waits six times as long.
    ACCEPTANCE_SLOW: "1"
  script:
  # Libraries the emulator loads even without a window, and JDK 17: the key
  # store plugin (biometric_storage) asks Gradle for a Java 17 toolchain,
  # which the image doesn't have (the first run's build stopped there).
  - apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends libpulse0 libnss3 libgbm1 libxkbfile1 libxcomposite1 libxcursor1 libxdamage1 libxi6 libxtst6 openjdk-17-jdk-headless >/dev/null
  - dart run tool/bundle_node.dart --for-tests
  - export ACCEPTANCE_DEVICE=$(tool/android_emulator.sh)
  - flutter test tool/acceptance_test.dart
  after_script:
  - tail -n 60 /tmp/murmur-emulator.log || true

# In an iPhone simulator, on GitLab's macOS runner (tool/ios_simulator.sh
# boots one), against the node's macOS build.
"acceptance: [ios]":
  extends:
  - .flutter-macos
  - .acceptance-costly
  timeout: 60m
  script:
  - export ACCEPTANCE_DEVICE=$(tool/ios_simulator.sh)
  - flutter test tool/acceptance_test.dart

# The Mac app, on GitLab's macOS runner, with its own node (the node's macOS
# build) as on Windows and Linux. The job runs outside a desktop session
# (its window is never put on screen, and the notification centre refuses
# the app), so as on Windows the notification step skips itself; iOS's job
# covers Apple's notification centre.
"acceptance: [macos]":
  extends:
  - .flutter-macos
  - .acceptance-costly
  timeout: 60m
  variables:
    ACCEPTANCE_NO_NOTIFICATIONS: "1"
  script:
  - flutter test tool/acceptance_test.dart

build-web:
  extends:
  - .flutter
  - .checks
  stage: build
  script:
  - flutter build web --release
  artifacts:
    paths:
    - build/web/
    expire_in: 1 week

# The scheduled release: a release made by itself when the testnet
# checkpoint has aged, so first sessions never have many headers to check.
# It's the only job of a scheduled pipeline, and keeps nothing between
# runs. Schedule it on the default branch (weekly, say); "Run schedule" in
# GitLab starts it at once.
#
# 1. tool/refresh_checkpoint.dart takes a new checkpoint from the live
#    network, taking no node's word: every node is asked separately, from
#    the checkpoint shipped now, checked back to genesis, and all must
#    agree. With a checkpoint under a day old the job ends here: no release.
# 2. The same checks as any push run on that change: the generated
#    localizations, the analyzer and every test, the node's included.
# 3. tool/prepare_release.dart raises the patch version and gives
#    CHANGELOG.md its section (with the notes waiting under "Unreleased":
#    the release holds everything on the default branch).
# 4. The commit goes to the default branch and its tag `vX.Y.Z` after it.
#    The tag starts the release pipeline below, which checks everything
#    again before it builds, deploys and publishes.
#
# A failure anywhere leaves nothing pushed. The pushes need
# RELEASE_BOT_TOKEN: a project access token (role Maintainer, scope
# write_repository; Maintainers may push to the default branch and create
# `v*` tags), as a masked, hidden and protected CI/CD variable.
scheduled-release:
  extends: .flutter
  stage: test
  rules:
  - if: $CI_PIPELINE_SOURCE == "schedule" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  variables:
    MURMUR_REQUIRE_NODE: "1"
  script:
  - |
    if [ -z "$RELEASE_BOT_TOKEN" ]; then
      echo "RELEASE_BOT_TOKEN is not set: see the comment on this job"
      exit 1
    fi
  - flutter test tool/refresh_checkpoint.dart
  - |
    if git diff --quiet -- lib/protocol/network.dart; then
      echo "the checkpoint is less than a day old: no release"
      exit 0
    fi
    flutter gen-l10n
    git diff --exit-code -- lib/l10n
    flutter analyze
    dart run tool/bundle_node.dart --for-tests
    flutter test
    dart run tool/prepare_release.dart
    version=$(cat build/release-version)
    height=$(sed -n "s/.*checkpoint: Checkpoint(\([0-9]*\), '[0-9a-f]*').*/\1/p" lib/protocol/network.dart)
    echo "releasing v$version with the checkpoint at block $height"
    git config user.name "Scheduled release (CI)"
    git config user.email "$GITLAB_USER_EMAIL"
    git commit -m "Release v$version: testnet checkpoint at block $height" \
      -m "Made by the scheduled release ($CI_PIPELINE_URL): tool/refresh_checkpoint.dart took the checkpoint from the live network (the testnet's nodes agreed on it, on a chain checked from genesis that holds the checkpoint shipped before), and analyze and the tests passed on it." \
      -- lib/protocol/network.dart pubspec.yaml CHANGELOG.md
    git tag "v$version"
    remote="https://oauth2:${RELEASE_BOT_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
    # The branch first, without a pipeline of its own (the tag's checks the
    # same commit); not forced, so it fails if the branch moved meanwhile.
    git push -o ci.skip "$remote" "HEAD:refs/heads/$CI_DEFAULT_BRANCH"
    git push "$remote" "refs/tags/v$version"

# Releases: on a version tag (v0.1.1), matching the version in pubspec.yaml,
# build the public testnet page, publish it as an archive with SHA256SUMS
# to the project's package registry, deploy it to app.murmur.info
# (Cloudflare Pages) and make a GitLab Release. Commits are only checked.
# Like the node's (../murmur/.gitlab-ci.yml).

.on-release-tag:
  rules:
  - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/

# A release ships the testnet checkpoint committed in
# lib/protocol/network.dart (tool/refresh_checkpoint.dart writes it before
# the tag). This checks it against the live network, which is never its
# source: every node behind the seed name must serve a chain that holds it
# and checks out back to genesis, and it must be under a week old. A failure
# here stops the release before anything is built.
check-checkpoint:
  extends:
  - .flutter
  - .on-release-tag
  stage: test
  script:
  - flutter test tool/check_checkpoint.dart

# The client about to be released, against the live testnet, read-only
# (test/live_release_test.dart sends nothing): it syncs from the shipped
# checkpoint and proves the supply, the burn pool and an account, and reads
# the fees. A few requests whatever the chain's length, so it can't start
# failing releases as the chain grows; the checks that do grow with it
# (test/live_node_test.dart) are run by hand. Only here, so that ordinary
# pushes never depend on the public network; a failure stops the release
# before anything is built.
public-node-tests:
  extends:
  - .flutter
  - .on-release-tag
  stage: test
  variables:
    MURMUR_NODE: testnet-seed.murmur.info:7878
  script:
  - flutter test test/live_release_test.dart

# The public testnet page, app.murmur.info on Cloudflare Pages (see README
# "Releases and deployment"). It connects to wss://node.murmur.info by
# default and loads nothing from other origins: CanvasKit is served locally
# and the fallback fonts are copied next to the page. web/_headers sets its
# response headers.
build-web-testnet:
  extends:
  - .flutter
  - .on-release-tag
  stage: build
  script:
  # The tag must match the version the app declares.
  - |
    version=$(sed -n 's/^version: *\([0-9.]*\).*/\1/p' pubspec.yaml)
    [ "$CI_COMMIT_TAG" = "v$version" ] || { echo "tag $CI_COMMIT_TAG does not match pubspec.yaml version $version"; exit 1; }
  - >-
    flutter build web --release --no-web-resources-cdn --base-href /
    --dart-define=MURMUR_NODE_HOST=node.murmur.info --dart-define=MURMUR_NODE_PORT=443
  - dart run tool/fetch_fallback_fonts.dart --cache .font-cache
  - test -f build/web/_headers
  cache:
  - key: flutter-sdk-$FLUTTER_VERSION
    paths:
    - .flutter-sdk/
  - key:
      files:
      - pubspec.lock
    paths:
    - .pub-cache/
  - key: fallback-fonts
    paths:
    - .font-cache/
  artifacts:
    paths:
    - build/web/
    expire_in: 1 week

# GitLab's Windows runner, ready to build the app: the pinned Flutter SDK
# (cloned and cached, as on Linux) and Visual Studio's ATL.
.flutter-windows:
  tags:
  - saas-windows-medium-amd64
  cache:
  - key: flutter-sdk-windows-$FLUTTER_VERSION
    paths:
    - .flutter-sdk-windows/
  before_script:
  - |
    if ((Get-Content .flutter-sdk-windows/.ci-version -ErrorAction SilentlyContinue) -ne $env:FLUTTER_VERSION) {
      Remove-Item -Recurse -Force .flutter-sdk-windows -ErrorAction SilentlyContinue
      # Long paths: some of the SDK's test files pass Windows' 260 characters.
      git clone -c core.longpaths=true --depth 1 --branch $env:FLUTTER_VERSION https://github.com/flutter/flutter.git .flutter-sdk-windows
      Set-Content .flutter-sdk-windows/.ci-version $env:FLUTTER_VERSION
    }
  - $env:Path = "$env:CI_PROJECT_DIR\.flutter-sdk-windows\bin;$env:Path"
  # The runner's Visual Studio Build Tools come without ATL, which the
  # secure-storage plugin needs (atlstr.h): add it. v0.2.1's Windows build
  # failed for lack of it.
  - |
    $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer"
    $vs = & "$installer\vswhere.exe" -latest -products * -property installationPath
    $atl = & "$installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.ATL -property installationPath
    if (-not $atl) {
      $p = Start-Process -Wait -PassThru -FilePath "$installer\setup.exe" -ArgumentList "modify --installPath `"$vs`" --add Microsoft.VisualStudio.Component.VC.ATL --quiet --norestart"
      Write-Output "added ATL to ${vs}: exit code $($p.ExitCode)"
      # 3010 means done, restart wanted: not needed to compile.
      if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) { exit 1 }
    }
  # What the runner has to build with, for when a job fails.
  - flutter doctor -v
  - flutter pub get

# The acceptance tests in the Windows app, on GitLab's Windows runner,
# against a node of their own. The runner is a server system without a
# graphics card or the Visual C++ runtime (see build-windows), so the debug
# app the tests build gets, beside it, the software graphics the smoke test
# uses and Visual Studio's debug runtime, and the node gets the release
# runtime. The app keeps its settings in memory here (app_driver.dart), so
# Windows' own storage isn't needed.
"acceptance: [windows]":
  extends:
  - .flutter-windows
  - .acceptance-costly
  timeout: 60m
  script:
  - dart run tool/bundle_node.dart --for-tests
  # The debug build first, so its folder is there to put things beside the
  # app; the tests' own build fills the same folder.
  - flutter build windows --debug
  - $app = "build\windows\x64\runner\Debug"
  - powershell -NoProfile -ExecutionPolicy Bypass -File tool\fetch_test_graphics.ps1 -Into $app
  - if ($LASTEXITCODE -ne 0) { exit 1 }
  - |
    $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
    $debug = Get-ChildItem "$vs\VC\Redist\MSVC\*\debug_nonredist\x64\Microsoft.VC14*.DebugCRT\*.dll" | Sort-Object FullName
    $ucrt = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\ucrt\ucrtbased.dll" | Sort-Object FullName | Select-Object -Last 1
    $release = Get-ChildItem "$vs\VC\Redist\MSVC\*\x64\Microsoft.VC14*.CRT\*.dll" | Sort-Object FullName
    $debug + $ucrt | ForEach-Object { Copy-Item $_.FullName $app -Force }
    $release | ForEach-Object { Copy-Item $_.FullName build\node -Force }
    Write-Output "debug runtime beside the app: $(($debug + $ucrt).Name -join ', '); release runtime beside the node: $($release.Name -join ', ')"
  - dart run tool/desktop_smoke_test.dart --check-system $app
  # The runner's service session has no desktop: the Windows notification
  # plugin's start-up ended the app there (2026-10-20), so the notification
  # test skips itself. On a desktop (by hand) it runs.
  - $env:ACCEPTANCE_NO_NOTIFICATIONS = '1'
  - flutter test tool/acceptance_test.dart
  - if ($LASTEXITCODE -ne 0) { exit 1 }

# The Windows app for the testnet, as a zip to unpack and run: the app
# (shown as Murmur, murmur_client.exe), the pinned node beside it
# (tool/bundle_node.dart), the Visual C++ runtime and the notices
# (tool/package_desktop.dart), after tool/desktop_smoke_test.dart has tried it.
# On GitLab's Windows runner, like the node's own Windows build. Allowed to
# fail: it must never hold back the page's release. A failure shows as a
# warning on the pipeline, and that release then has no Windows download
# (its link on the release page leads nowhere).
build-windows:
  extends:
  - .on-release-tag
  - .flutter-windows
  stage: build
  allow_failure: true
  script:
  # First a build whose own node stays off the public network, to try: its
  # node starts and stops with it, a node left by a killed app is replaced,
  # and a wallet is saved through Windows' own secure storage. The runner's
  # profile is a clean one, which the test needs (it refuses any other).
  # It's tried as packaged, the folder a user unpacks: the runner has no
  # Visual C++ runtime of its own, so the app starts only with the copies
  # the package carries (v0.2.4's test started it from the build folder,
  # and it couldn't load them). Nor has the runner, a server system with no
  # graphics card, what every desktop Windows has for Flutter's engine to
  # draw with: tool\fetch_test_graphics.ps1 puts a software OpenGL (Mesa)
  # and Windows' software Direct3D (Microsoft's WARP package), pinned by
  # hash, beside this copy. This copy is only tried; the released package
  # is built afresh below, and checked to hold none of them.
  - flutter build windows --release --dart-define=MURMUR_LOCAL_NODE_SPEC=demo
  - dart run tool/bundle_node.dart
  - dart run tool/package_desktop.dart --tag smoke
  - powershell -NoProfile -ExecutionPolicy Bypass -File tool\fetch_test_graphics.ps1 -Into build\desktop-package\murmur-client-smoke-windows-x64
  - if ($LASTEXITCODE -ne 0) { exit 1 }
  - dart run tool/desktop_smoke_test.dart --wallet-storage build\desktop-package\murmur-client-smoke-windows-x64
  - if ($LASTEXITCODE -ne 0) { exit 1 }
  - Remove-Item dist\murmur-client-smoke-windows-x64.zip
  # Then the one that's released: its default node is the testnet's seed.
  - >-
    flutter build windows --release
    --dart-define=MURMUR_NODE_HOST=testnet-seed.murmur.info --dart-define=MURMUR_NODE_PORT=7878
  - dart run tool/bundle_node.dart
  - dart run tool/package_desktop.dart --tag $env:CI_COMMIT_TAG
  # Nothing of the test's may be in what's released.
  - |
    $inside = tar -tf "dist\murmur-client-$env:CI_COMMIT_TAG-windows-x64.zip"
    $foreign = @($inside | Where-Object { $_ -match '(opengl32|libgallium_wgl|d3d10warp)\.dll$' })
    if ($foreign.Count -gt 0) { Write-Output "the released package holds test-only files: $($foreign -join ', ')"; exit 1 }
    Write-Output "the released package holds $($inside.Count) entries, none of the test's"
  artifacts:
    paths:
    - dist/murmur-client-*-windows-x64.zip
    expire_in: 1 week

# The Linux app for the testnet, as an archive to unpack and run: the app
# (shown as Murmur, murmur_client), the pinned node beside it and the
# notices. It's tried first, as packaged, by the same test as the Windows
# app (tool/desktop_smoke_test.dart): its own node starts with it and stops
# with its window, a node left by a killed app is replaced, and a wallet is
# saved through the real keyring (integration_test/wallet_storage_test.dart).
# tool/linux_session.sh gives that test a virtual display and a session
# with an unlocked keyring, as a desktop gives the app; the copy that's
# tried has its own node on the demo network. Allowed to fail, like the
# Windows build: it must never hold back the page's release.
build-linux:
  extends:
  - .flutter
  - .on-release-tag
  stage: build
  allow_failure: true
  script:
  - apt-get update -qq
  - DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends $LINUX_APP_PACKAGES
  # First a build whose own node stays off the public network, to try, as
  # packaged: the folder a user unpacks.
  - flutter build linux --release --dart-define=MURMUR_LOCAL_NODE_SPEC=demo
  - dart run tool/bundle_node.dart
  - dart run tool/package_desktop.dart --tag smoke
  - tool/linux_session.sh dart run tool/desktop_smoke_test.dart --wallet-storage build/desktop-package/murmur-client-smoke-linux-x64
  - rm dist/murmur-client-smoke-linux-*.tar.gz
  # Then the one that's released: its default node is the testnet's seed.
  - >-
    flutter build linux --release
    --dart-define=MURMUR_NODE_HOST=testnet-seed.murmur.info --dart-define=MURMUR_NODE_PORT=7878
  - dart run tool/bundle_node.dart
  - dart run tool/package_desktop.dart --tag "$CI_COMMIT_TAG"
  artifacts:
    paths:
    - dist/murmur-client-*-linux-*.tar.gz
    expire_in: 1 week

# The page as a downloadable archive, and the desktop apps that were built,
# with their checksums, in the package registry: anyone can check that the
# live page is a release, or host it, and that a download is the release's.
package:
  extends: .on-release-tag
  image: alpine:3.20
  stage: package
  needs:
  - build-web-testnet
  - job: build-windows
    artifacts: true
  - job: build-linux
    artifacts: true
  script:
  - apk add --no-cache curl zip
  - mkdir -p dist
  - name="murmur-web-$CI_COMMIT_TAG.zip"
  - (cd build/web && zip -q -r "../../dist/$name" .)
  # The license and notice travel with the page.
  - zip -q -j "dist/$name" LICENSE NOTICE
  - cd dist
  # One list for everything released: the page, and each desktop app whose
  # build succeeded.
  - sha256sum murmur-* > SHA256SUMS
  - cat SHA256SUMS
  - |
    # Retries spaced over about five minutes: v0.8.0's upload met an outage of
    # gitlab.com that outlasted curl's default spacing, and the release stopped.
    upload() { # <package> <file>...
      package=$1; shift
      for f in "$@" SHA256SUMS; do
        curl --fail --silent --show-error --retry 10 --retry-delay 15 --retry-all-errors --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "$f" \
          "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/$package/$CI_COMMIT_TAG/$f"
      done
    }
    upload murmur-web "$name"
    for desktop in "windows murmur-client-$CI_COMMIT_TAG-windows-x64.zip" "linux murmur-client-$CI_COMMIT_TAG-linux-x64.tar.gz"; do
      system=${desktop%% *}; file=${desktop#* }
      if [ -f "$file" ]; then
        upload "murmur-client-$system" "$file"
      else
        echo "no $system app in this release: its build failed"
      fi
    done
  artifacts:
    paths:
    - dist/
    expire_in: 1 week

# Uploads the page to the Cloudflare Pages project. Needs the protected
# CI/CD variables CLOUDFLARE_API_TOKEN (a token with Account > Cloudflare
# Pages > Edit) and CLOUDFLARE_ACCOUNT_ID; protected variables reach only
# protected tags, so v* tags must be protected too.
deploy-web:
  extends: .on-release-tag
  image: node:22-slim
  stage: deploy
  needs:
  - build-web-testnet
  - package
  variables:
    CF_PAGES_PROJECT: murmur-app
  script:
  - >-
    npx --yes wrangler@4 pages deploy build/web
    --project-name "$CF_PAGES_PROJECT" --branch "$CI_DEFAULT_BRANCH"
    --commit-hash "$CI_COMMIT_SHA" --commit-message "$CI_COMMIT_TAG: $CI_COMMIT_TITLE" --commit-dirty=true

# The GitLab Release, once the page is live.
release:
  extends: .on-release-tag
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  stage: release
  needs:
  - deploy-web
  script:
  - echo "Releasing the Murmur client $CI_COMMIT_TAG"
  release:
    tag_name: $CI_COMMIT_TAG
    name: Murmur client $CI_COMMIT_TAG
    description: "Murmur client $CI_COMMIT_TAG, live at https://app.murmur.info. Changes: see CHANGELOG.md. Verify the download against SHA256SUMS."
    assets:
      links:
      - name: Web app (testnet build)
        url: "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/murmur-web/$CI_COMMIT_TAG/murmur-web-$CI_COMMIT_TAG.zip"
      - name: Windows app (testnet build, x64)
        url: "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/murmur-client-windows/$CI_COMMIT_TAG/murmur-client-$CI_COMMIT_TAG-windows-x64.zip"
      - name: Linux app (testnet build, x64)
        url: "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/murmur-client-linux/$CI_COMMIT_TAG/murmur-client-$CI_COMMIT_TAG-linux-x64.tar.gz"
      - name: SHA256SUMS
        url: "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/murmur-web/$CI_COMMIT_TAG/SHA256SUMS"
      - name: Live page
        url: "https://app.murmur.info"
