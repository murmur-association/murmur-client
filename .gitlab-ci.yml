# Checks on every push: static analysis, the unit tests, and a web build.
# A version tag also releases (see "Releases" below), and a scheduled
# pipeline makes a release of its own when the testnet checkpoint has aged
# (see "The scheduled release").
# The Flutter version is pinned by FLUTTER_VERSION below; raise it
# deliberately, together with the version used locally.
stages:
- check
- test
- build
- package
- secret-detection
- deploy
- release

include:
- template: Security/SAST.gitlab-ci.yml
- template: Security/Secret-Detection.gitlab-ci.yml

variables:
  SECRET_DETECTION_ENABLED: 'true'
  # The Flutter SDK every job builds with (cloned at this tag, and cached).
  FLUTTER_VERSION: "3.47.5"

# No merge request pipelines (pushes are checked as branch pipelines), and a
# scheduled pipeline holds the scheduled release alone: the scanners are
# switched off there, and the checks below leave themselves out.
workflow:
  rules:
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    when: never
  - if: $CI_PIPELINE_SOURCE == "schedule"
    variables:
      SAST_DISABLED: "true"
      SECRET_DETECTION_DISABLED: "true"
  - when: always

sast:
  stage: test
secret_detection:
  stage: secret-detection

.flutter:
  # A base system with Flutter's dependencies. The Flutter SDK itself is
  # pinned by FLUTTER_VERSION and cloned from the official repository (and
  # cached), since images aren't published for every release.
  image: ghcr.io/cirruslabs/flutter:3.44.0
  variables:
    PUB_CACHE: "$CI_PROJECT_DIR/.pub-cache"
  before_script:
  - |
    if [ "$(cat .flutter-sdk/.ci-version 2>/dev/null)" != "$FLUTTER_VERSION" ]; then
      rm -rf .flutter-sdk
      git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git .flutter-sdk
      echo "$FLUTTER_VERSION" > .flutter-sdk/.ci-version
    fi
  - export PATH="$CI_PROJECT_DIR/.flutter-sdk/bin:$PATH"
  - flutter --version
  - flutter pub get
  cache:
  - key: flutter-sdk-$FLUTTER_VERSION
    paths:
    - .flutter-sdk/
  - key:
      files:
      - pubspec.lock
    paths:
    - .pub-cache/

# The checks of every push and tag; not of a scheduled pipeline, where the
# scheduled release runs them itself on what it's about to publish.
.checks:
  rules:
  - if: $CI_PIPELINE_SOURCE == "schedule"
    when: never
  - when: on_success

analyze:
  extends:
  - .flutter
  - .checks
  stage: check
  script:
  # The generated localizations must match the ARB files.
  - flutter gen-l10n
  - git diff --exit-code -- lib/l10n
  - flutter analyze

test:
  extends:
  - .flutter
  - .checks
  stage: test
  variables:
    # The tests against the node must run here, not skip themselves.
    MURMUR_REQUIRE_NODE: "1"
  script:
  # The pinned murmur-node release (tool/node_release.dart), checked
  # against its SHA256SUMS, for the tests that start nodes on chains it
  # builds (test/node_test.dart). The public-node tests skip themselves
  # without MURMUR_NODE.
  - dart run tool/bundle_node.dart --for-tests
  - flutter test

build-web:
  extends:
  - .flutter
  - .checks
  stage: build
  script:
  - flutter build web --release
  artifacts:
    paths:
    - build/web/
    expire_in: 1 week

# The scheduled release: a release made by itself when the testnet
# checkpoint has aged, so first sessions never have many headers to check.
# It's the only job of a scheduled pipeline, and keeps nothing between
# runs. Schedule it on the default branch (weekly, say); "Run schedule" in
# GitLab starts it at once.
#
# 1. tool/refresh_checkpoint.dart takes a new checkpoint from the live
#    network, taking no node's word: every node is asked separately, from
#    the checkpoint shipped now, checked back to genesis, and all must
#    agree. With a checkpoint under a day old the job ends here: no release.
# 2. The same checks as any push run on that change: the generated
#    localizations, the analyzer and every test, the node's included.
# 3. tool/prepare_release.dart raises the patch version and gives
#    CHANGELOG.md its section (with the notes waiting under "Unreleased":
#    the release holds everything on the default branch).
# 4. The commit goes to the default branch and its tag `vX.Y.Z` after it.
#    The tag starts the release pipeline below, which checks everything
#    again before it builds, deploys and publishes.
#
# A failure anywhere leaves nothing pushed. The pushes need
# RELEASE_BOT_TOKEN: a project access token (role Maintainer, scope
# write_repository; Maintainers may push to the default branch and create
# `v*` tags), as a masked, hidden and protected CI/CD variable.
scheduled-release:
  extends: .flutter
  stage: test
  rules:
  - if: $CI_PIPELINE_SOURCE == "schedule" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  variables:
    MURMUR_REQUIRE_NODE: "1"
  script:
  - |
    if [ -z "$RELEASE_BOT_TOKEN" ]; then
      echo "RELEASE_BOT_TOKEN is not set: see the comment on this job"
      exit 1
    fi
  - flutter test tool/refresh_checkpoint.dart
  - |
    if git diff --quiet -- lib/protocol/network.dart; then
      echo "the checkpoint is less than a day old: no release"
      exit 0
    fi
    flutter gen-l10n
    git diff --exit-code -- lib/l10n
    flutter analyze
    dart run tool/bundle_node.dart --for-tests
    flutter test
    dart run tool/prepare_release.dart
    version=$(cat build/release-version)
    height=$(sed -n "s/.*checkpoint: Checkpoint(\([0-9]*\), '[0-9a-f]*').*/\1/p" lib/protocol/network.dart)
    echo "releasing v$version with the checkpoint at block $height"
    git config user.name "Scheduled release (CI)"
    git config user.email "$GITLAB_USER_EMAIL"
    git commit -m "Release v$version: testnet checkpoint at block $height" \
      -m "Made by the scheduled release ($CI_PIPELINE_URL): tool/refresh_checkpoint.dart took the checkpoint from the live network (the testnet's nodes agreed on it, on a chain checked from genesis that holds the checkpoint shipped before), and analyze and the tests passed on it." \
      -- lib/protocol/network.dart pubspec.yaml CHANGELOG.md
    git tag "v$version"
    remote="https://oauth2:${RELEASE_BOT_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
    # The branch first, without a pipeline of its own (the tag's checks the
    # same commit); not forced, so it fails if the branch moved meanwhile.
    git push -o ci.skip "$remote" "HEAD:refs/heads/$CI_DEFAULT_BRANCH"
    git push "$remote" "refs/tags/v$version"

# Releases: on a version tag (v0.1.1), matching the version in pubspec.yaml,
# build the public testnet page, publish it as an archive with SHA256SUMS
# to the project's package registry, deploy it to app.murmur.info
# (Cloudflare Pages) and make a GitLab Release. Commits are only checked.
# Like the node's (../murmur/.gitlab-ci.yml).

.on-release-tag:
  rules:
  - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/

# A release ships the testnet checkpoint committed in
# lib/protocol/network.dart (tool/refresh_checkpoint.dart writes it before
# the tag). This checks it against the live network, which is never its
# source: every node behind the seed name must serve a chain that holds it
# and checks out back to genesis, and it must be under a week old. A failure
# here stops the release before anything is built.
check-checkpoint:
  extends:
  - .flutter
  - .on-release-tag
  stage: test
  script:
  - flutter test tool/check_checkpoint.dart

# The client about to be released, against the live testnet, read-only
# (test/live_release_test.dart sends nothing): it syncs from the shipped
# checkpoint and proves the supply, the burn pool and an account, and reads
# the fees. A few requests whatever the chain's length, so it can't start
# failing releases as the chain grows; the checks that do grow with it
# (test/live_node_test.dart) are run by hand. Only here, so that ordinary
# pushes never depend on the public network; a failure stops the release
# before anything is built.
public-node-tests:
  extends:
  - .flutter
  - .on-release-tag
  stage: test
  variables:
    MURMUR_NODE: testnet-seed.murmur.info:7878
  script:
  - flutter test test/live_release_test.dart

# The public testnet page, app.murmur.info on Cloudflare Pages (see README
# "Releases and deployment"). It connects to wss://node.murmur.info by
# default and loads nothing from other origins: CanvasKit is served locally
# and the fallback fonts are copied next to the page. web/_headers sets its
# response headers.
build-web-testnet:
  extends:
  - .flutter
  - .on-release-tag
  stage: build
  script:
  # The tag must match the version the app declares.
  - |
    version=$(sed -n 's/^version: *\([0-9.]*\).*/\1/p' pubspec.yaml)
    [ "$CI_COMMIT_TAG" = "v$version" ] || { echo "tag $CI_COMMIT_TAG does not match pubspec.yaml version $version"; exit 1; }
  - >-
    flutter build web --release --no-web-resources-cdn --base-href /
    --dart-define=MURMUR_NODE_HOST=node.murmur.info --dart-define=MURMUR_NODE_PORT=443
  - dart run tool/fetch_fallback_fonts.dart --cache .font-cache
  - test -f build/web/_headers
  cache:
  - key: flutter-sdk-$FLUTTER_VERSION
    paths:
    - .flutter-sdk/
  - key:
      files:
      - pubspec.lock
    paths:
    - .pub-cache/
  - key: fallback-fonts
    paths:
    - .font-cache/
  artifacts:
    paths:
    - build/web/
    expire_in: 1 week

# The Windows app for the testnet, as a zip to unpack and run: the app
# (shown as Murmur, murmur_client.exe), the pinned node beside it
# (tool/bundle_node.dart), the Visual C++ runtime and the notices
# (tool/package_desktop.dart). Its default node is the testnet's seed name.
# On GitLab's Windows runner, like the node's own Windows build. Allowed to
# fail: it must never hold back the page's release. A failure shows as a
# warning on the pipeline, and that release then has no Windows download
# (its link on the release page leads nowhere).
build-windows:
  extends: .on-release-tag
  stage: build
  tags:
  - saas-windows-medium-amd64
  allow_failure: true
  cache:
  - key: flutter-sdk-windows-$FLUTTER_VERSION
    paths:
    - .flutter-sdk-windows/
  script:
  - |
    if ((Get-Content .flutter-sdk-windows/.ci-version -ErrorAction SilentlyContinue) -ne $env:FLUTTER_VERSION) {
      Remove-Item -Recurse -Force .flutter-sdk-windows -ErrorAction SilentlyContinue
      git clone --depth 1 --branch $env:FLUTTER_VERSION https://github.com/flutter/flutter.git .flutter-sdk-windows
      Set-Content .flutter-sdk-windows/.ci-version $env:FLUTTER_VERSION
    }
  - $env:Path = "$env:CI_PROJECT_DIR\.flutter-sdk-windows\bin;$env:Path"
  # What the runner has to build with, for when this job fails.
  - flutter doctor -v
  - flutter pub get
  - >-
    flutter build windows --release
    --dart-define=MURMUR_NODE_HOST=testnet-seed.murmur.info --dart-define=MURMUR_NODE_PORT=7878
  - dart run tool/bundle_node.dart
  - dart run tool/package_desktop.dart --tag $env:CI_COMMIT_TAG
  artifacts:
    paths:
    - dist/murmur-client-*-windows-x64.zip
    expire_in: 1 week

# The Linux app for the testnet, as an archive to unpack and run: the app
# (shown as Murmur, murmur_client), the pinned node beside it and the
# notices. Before packaging, tool/linux_smoke_test.sh starts it on a virtual
# display (with a session bus and an unlocked keyring, as a desktop gives
# it) and checks that its own node starts with it and stops with its window,
# that a node left by a killed app is replaced, and that a wallet is saved
# through the real keyring (integration_test/wallet_storage_test.dart);
# that run uses a build whose own node is on the demo network. Allowed to
# fail, like the Windows build: it must never hold back the page's release.
build-linux:
  extends:
  - .flutter
  - .on-release-tag
  stage: build
  allow_failure: true
  script:
  - apt-get update -qq
  - >-
    DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends
    clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev g++ libsecret-1-dev libjsoncpp-dev
    xvfb openbox wmctrl dbus dbus-x11 gnome-keyring libgl1-mesa-dri libegl1 libgles2 procps
  # First a build whose own node stays off the public network, to try.
  - flutter build linux --release --dart-define=MURMUR_LOCAL_NODE_SPEC=demo
  - dart run tool/bundle_node.dart
  - tool/linux_smoke_test.sh --wallet-storage
  # Then the one that's released: its default node is the testnet's seed.
  - >-
    flutter build linux --release
    --dart-define=MURMUR_NODE_HOST=testnet-seed.murmur.info --dart-define=MURMUR_NODE_PORT=7878
  - dart run tool/bundle_node.dart
  - dart run tool/package_desktop.dart --tag "$CI_COMMIT_TAG"
  artifacts:
    paths:
    - dist/murmur-client-*-linux-*.tar.gz
    expire_in: 1 week

# The page as a downloadable archive, and the desktop apps that were built,
# with their checksums, in the package registry: anyone can check that the
# live page is a release, or host it, and that a download is the release's.
package:
  extends: .on-release-tag
  image: alpine:3.20
  stage: package
  needs:
  - build-web-testnet
  - job: build-windows
    artifacts: true
  - job: build-linux
    artifacts: true
  script:
  - apk add --no-cache curl zip
  - mkdir -p dist
  - name="murmur-web-$CI_COMMIT_TAG.zip"
  - (cd build/web && zip -q -r "../../dist/$name" .)
  # The license and notice travel with the page.
  - zip -q -j "dist/$name" LICENSE NOTICE
  - cd dist
  # One list for everything released: the page, and each desktop app whose
  # build succeeded.
  - sha256sum murmur-* > SHA256SUMS
  - cat SHA256SUMS
  - |
    upload() { # <package> <file>...
      package=$1; shift
      for f in "$@" SHA256SUMS; do
        curl --fail --silent --show-error --retry 5 --retry-all-errors --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "$f" \
          "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/$package/$CI_COMMIT_TAG/$f"
      done
    }
    upload murmur-web "$name"
    for desktop in "windows murmur-client-$CI_COMMIT_TAG-windows-x64.zip" "linux murmur-client-$CI_COMMIT_TAG-linux-x64.tar.gz"; do
      system=${desktop%% *}; file=${desktop#* }
      if [ -f "$file" ]; then
        upload "murmur-client-$system" "$file"
      else
        echo "no $system app in this release: its build failed"
      fi
    done
  artifacts:
    paths:
    - dist/
    expire_in: 1 week

# Uploads the page to the Cloudflare Pages project. Needs the protected
# CI/CD variables CLOUDFLARE_API_TOKEN (a token with Account > Cloudflare
# Pages > Edit) and CLOUDFLARE_ACCOUNT_ID; protected variables reach only
# protected tags, so v* tags must be protected too.
deploy-web:
  extends: .on-release-tag
  image: node:22-slim
  stage: deploy
  needs:
  - build-web-testnet
  - package
  variables:
    CF_PAGES_PROJECT: murmur-app
  script:
  - >-
    npx --yes wrangler@4 pages deploy build/web
    --project-name "$CF_PAGES_PROJECT" --branch "$CI_DEFAULT_BRANCH"
    --commit-hash "$CI_COMMIT_SHA" --commit-message "$CI_COMMIT_TAG: $CI_COMMIT_TITLE" --commit-dirty=true

# The GitLab Release, once the page is live.
release:
  extends: .on-release-tag
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  stage: release
  needs:
  - deploy-web
  script:
  - echo "Releasing the Murmur client $CI_COMMIT_TAG"
  release:
    tag_name: $CI_COMMIT_TAG
    name: Murmur client $CI_COMMIT_TAG
    description: "Murmur client $CI_COMMIT_TAG, live at https://app.murmur.info. Changes: see CHANGELOG.md. Verify the download against SHA256SUMS."
    assets:
      links:
      - name: Web app (testnet build)
        url: "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/murmur-web/$CI_COMMIT_TAG/murmur-web-$CI_COMMIT_TAG.zip"
      - name: Windows app (testnet build, x64)
        url: "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/murmur-client-windows/$CI_COMMIT_TAG/murmur-client-$CI_COMMIT_TAG-windows-x64.zip"
      - name: Linux app (testnet build, x64)
        url: "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/murmur-client-linux/$CI_COMMIT_TAG/murmur-client-$CI_COMMIT_TAG-linux-x64.tar.gz"
      - name: SHA256SUMS
        url: "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/murmur-web/$CI_COMMIT_TAG/SHA256SUMS"
      - name: Live page
        url: "https://app.murmur.info"
