name: murmur_client
description: Light client for the Murmur chain. Browse blocks, transactions and messages, and submit new transactions.
publish_to: none
version: 0.7.0

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  crypto: ^3.0.3
  cryptography: ^2.7.0
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2
  path_provider: ^2.1.5
  web: ^1.1.0
  web_socket_channel: ^3.0.1
  url_launcher: ^6.3.2
  qr: ^4.0.0
  share_plus: ^12.0.2
  biometric_storage: ^5.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  # The host's end of a browser run of integration_test/ (test_driver/).
  flutter_driver:
    sdk: flutter
  flutter_lints: ^4.0.0
  # Runs tests inside the built app, with its real plugins (integration_test/).
  # Windows calls of tool/desktop_smoke_test.dart (finding and closing the app's window).
  ffi: ^2.1.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true
