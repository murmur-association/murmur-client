# The whole regression on every push: the analyzer, the unit tests and the
# tests against the pinned node, a web build, the acceptance tests on every
# flavour (integration_test/acceptance_test.dart, run by
# tool/acceptance_test.dart: the Linux, Windows and Mac apps, Chrome with a
# passphrase and with a passkey, Firefox, Safari, an Android emulator and an
# iPhone simulator, each phone also running the phone storage test), and the
# packaged desktop apps' smoke tests (tool/desktop_smoke_test.dart: Linux,
# Windows and macOS). GitHub's hosted runners are free for a
# public repository, and its Linux runners have KVM, so Android's emulator
# is accelerated here (on GitLab's it emulated the processor, about 50
# minutes a run).
#
# Every job sets up Flutter, the packages and what it builds with through
# one local action (.github/actions/flutter), after its checkout.
#
# Releases are release.yml (on a vX.Y.Z tag) and scheduled-release.yml
# (daily, when the testnet checkpoint has aged).
name: regression

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  # The release runs the whole regression on the commit it releases, and
  # builds nothing unless it passes (release.yml).
  workflow_call:
    inputs:
      ref:
        description: The commit to check (a tag), checked out by every job.
        required: true
        type: string

permissions:
  contents: read

# A newer push to the same branch replaces a run still going. A release's
# regression is a group of its own, never cancelled: a push to main while
# the scheduled release runs must not take its check away.
concurrency:
  group: ${{ inputs.ref && format('release-regression-{0}', inputs.ref) || format('regression-{0}', github.ref) }}
  cancel-in-progress: ${{ !inputs.ref }}

env:
  # The tests against the node must run, not skip themselves.
  MURMUR_REQUIRE_NODE: "1"

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.ref || github.sha }}
    - uses: ./.github/actions/flutter
    # The generated localizations must match the ARB files.
    - run: flutter gen-l10n && git diff --exit-code -- lib/l10n
    - run: flutter analyze

  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.ref || github.sha }}
    - uses: ./.github/actions/flutter
    # The pinned murmur-node release (tool/node_release.dart), checked
    # against its SHA256SUMS. The public-node tests skip themselves without
    # MURMUR_NODE.
    - run: dart run tool/bundle_node.dart --for-tests
    - run: flutter test

  build-web:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.ref || github.sha }}
    - uses: ./.github/actions/flutter
    - run: flutter build web --release --no-web-resources-cdn
    - run: dart run tool/fetch_fallback_fonts.dart

  # The Linux app (with its own node) and the browsers, in one throwaway
  # session each (tool/linux_session.sh).
  acceptance-linux:
    name: 'acceptance: [${{ matrix.device }}]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        device: [linux, chrome, chrome-passkey, firefox]
    env:
      ACCEPTANCE_DEVICE: ${{ matrix.device }}
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.ref || github.sha }}
    # Firefox's archive is xz, and it plays (and so loads) sound.
    - uses: ./.github/actions/flutter
      with:
        linux: session libnss3 libgbm1 xz-utils libasound2t64
    # Ubuntu 24.04 keeps programs without an AppArmor profile of their own
    # from user namespaces, which the pinned browsers' sandboxes need.
    - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
    - run: dart run tool/bundle_node.dart --for-tests
    # The pinned browsers, kept between runs (the tool keeps a pinned version
    # it finds, and fetches only what isn't there).
    - if: matrix.device != 'linux'
      uses: actions/cache@v4
      with:
        path: build/test-browser
        key: test-browser-${{ startsWith(matrix.device, 'chrome') && 'chrome' || matrix.device }}-${{ hashFiles('tool/fetch_test_browser.dart') }}
    - name: The pinned browser
      run: |
        case "$ACCEPTANCE_DEVICE" in
          chrome*) dart run tool/fetch_test_browser.dart chrome;;
          firefox) dart run tool/fetch_test_browser.dart firefox;;
        esac
    - run: tool/linux_session.sh flutter test --reporter expanded tool/acceptance_test.dart

  # In an Android emulator, accelerated by KVM. The runner answers the
  # system's screens from the host (tool/android_system.dart): the
  # notification permission, a fingerprint enrolled and touched, a
  # notification opened from the shade, the background job run as Android
  # would.
  acceptance-android:
    name: 'acceptance: [android]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # Gradle and Kotlin without daemons, so the build's memory is given back
    # before the tests run: beside them the 4 GB emulator went offline two
    # minutes in, its log ending without a word (2026-11-03).
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dkotlin.compiler.execution.strategy=in-process
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.ref || github.sha }}
    - name: KVM for the runner's user
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
    # The key store plugin (biometric_storage) asks Gradle for Java 17.
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    # The emulator's libraries.
    - uses: ./.github/actions/flutter
      with:
        linux: libpulse0 libnss3 libgbm1 libxkbfile1 libxcomposite1 libxcursor1 libxdamage1 libxi6 libxtst6
    - name: The SDK's tools on the path
      run: |
        echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
        echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
    # The NDK and CMake the build asks for, ahead of it and with retries:
    # Gradle's own download once came back corrupt ("unknown archive") and
    # the app never built. The NDK's version is the pinned Flutter's.
    - name: The NDK and CMake
      run: |
        ndk=$(grep -rhoE 'ndkVersion[^"]*"[0-9.]+"' "$FLUTTER_ROOT/packages/flutter_tools/gradle" | grep -oE '[0-9][0-9.]+' | head -1)
        echo "NDK $ndk"
        for attempt in 1 2 3; do
          sdkmanager --install "ndk;$ndk" "cmake;3.22.1" >/dev/null && exit 0
          echo "::warning::the NDK's download failed (attempt $attempt)"
          rm -rf "$ANDROID_HOME/ndk/$ndk"
        done
        exit 1
    - run: dart run tool/bundle_node.dart --for-tests
    # Once more on a fresh emulator if the emulator itself went away during
    # the tests (offline, its log ending without a word: 2 runs of 5 on
    # 2026-11-03, at different steps); a failure with the emulator still up
    # is the app's, and isn't tried again. After the acceptance tests, on
    # the same emulator, the phone storage test
    # (integration_test/phone_storage_test.dart): the local copy in the
    # cache folder, cleared by the system itself, own messages kept.
    - name: Acceptance tests
      run: |
        df -h / | tail -n 1
        for attempt in 1 2; do
          # Assigned apart from export, so a failed boot stops the step.
          device=$(tool/android_emulator.sh)
          export ACCEPTANCE_DEVICE=$device
          if flutter test --reporter expanded tool/acceptance_test.dart &&
             flutter test --reporter expanded tool/phone_storage_test.dart; then exit 0; fi
          if [ "$(adb -s "$device" get-state 2>/dev/null)" = device ]; then exit 1; fi
          echo "::warning::the emulator went offline during the acceptance tests (attempt $attempt)"
          sudo dmesg | grep -iE 'segfault|traps:|killed process|out of memory' | tail -n 20 || true
          grep -- '^----' /tmp/murmur-emulator.log || true
          df -h / /tmp | tail -n 2
          pkill -f qemu-system || true
          adb kill-server || true
        done
        exit 1
    - if: always()
      run: |
        grep -- '^----' /tmp/murmur-emulator.log || true
        tail -n 60 /tmp/murmur-emulator.log || true
        df -h / | tail -n 1
        # Whether the kernel ended a process (memory, a crash), and the
        # emulator's own crash reports.
        sudo dmesg | grep -iE 'out of memory|killed process|oom|segfault|traps:' | tail -n 20 || true
        ls -la ~/.android/breakpad /tmp/android-*/emu-crash* 2>/dev/null | tail -n 20 || true
        free -m

  # In an iPhone simulator (tool/ios_simulator.sh boots one), against the
  # node's macOS build (universal: Intel and Apple silicon). The Apple jobs
  # run on Apple silicon. On 2026-11-03 those runners took no job twice in a
  # row ("capacity constraints"), and the jobs ran on Intel Macs
  # (macos-15-intel) for a day: slow enough that the test node, mining at 1%
  # of a core, left the suite's waits without a block (so ACCEPTANCE_SLOW,
  # six times the waits), and iOS once hung for hours. If Apple silicon
  # turns jobs away again, go back to both of those.
  acceptance-ios:
    name: 'acceptance: [ios]'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.ref || github.sha }}
    - name: The newest Xcode
      run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)" && xcodebuild -version
    - uses: ./.github/actions/flutter
    - run: dart run tool/bundle_node.dart --for-tests
    # Then the phone storage test on the same simulator
    # (integration_test/phone_storage_test.dart).
    - name: Acceptance tests
      run: |
        device=$(tool/ios_simulator.sh)
        export ACCEPTANCE_DEVICE=$device
        flutter test --reporter expanded tool/acceptance_test.dart
        flutter test --reporter expanded tool/phone_storage_test.dart

  # The Mac app, with its own node (the node's macOS build) as on Windows
  # and Linux, and its notifications in the runner's logged-in session
  # (GitHub's Macs have one; GitLab's console belonged to root). The system's
  # file dialog answers only a process with Accessibility, which the runner
  # hasn't: the suite hands a file over in its place.
  acceptance-macos:
    name: 'acceptance: [macos]'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.ref || github.sha }}
    - name: The newest Xcode
      run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)" && xcodebuild -version
    - uses: ./.github/actions/flutter
    - run: dart run tool/bundle_node.dart --for-tests
    - run: flutter test --reporter expanded tool/acceptance_test.dart

  # The page in Safari, the system's own, through safaridriver (enabled
  # here, which needs the runner's logged-in session). Safari's driver can't
  # grant notifications nor fill a file input, so the runner skips the
  # notification test and hands a picture over in the chooser's place.
  # Allowed to fail, since a release waits on this workflow: Safari as
  # safaridriver drives it here gives no canvas's pixels back
  # (InvalidStateError, noted by the "pictures" check), so the picture step
  # fails most runs (AGENTS.md, Known gaps 0).
  acceptance-safari:
    name: 'acceptance: [safari]'
    runs-on: macos-latest
    timeout-minutes: 60
    continue-on-error: true
    env:
      ACCEPTANCE_DEVICE: safari
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.ref || github.sha }}
    - uses: ./.github/actions/flutter
    - run: sudo safaridriver --enable
    - run: dart run tool/bundle_node.dart --for-tests
    - run: flutter test --reporter expanded tool/acceptance_test.dart

  # The Windows app. The debug app gets, beside it, the software graphics
  # the smoke test uses and Visual Studio's debug runtime, and the node the
  # release runtime, as on GitLab's server runner (harmless where the
  # system has them). GitHub's runner has a logged-on user's desktop, so the
  # notification step runs and the system's file dialog is worked from
  # outside the app (tool/system_chooser.dart); Windows can't list an
  # unpackaged app's notifications back, so there only the app's side is
  # checked.
  acceptance-windows:
    name: 'acceptance: [windows]'
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.ref || github.sha }}
    - uses: ./.github/actions/flutter
      with:
        atl: true
    - run: dart run tool/bundle_node.dart --for-tests
    # The debug build first, so its folder is there to put things beside.
    - run: flutter build windows --debug
    # The pinned graphics downloads, kept between runs (the script takes a
    # cached file whose SHA-256 is the pinned one).
    - uses: actions/cache@v4
      with:
        path: build/test-graphics
        key: test-graphics-${{ hashFiles('tool/fetch_test_graphics.ps1') }}
    - run: powershell -NoProfile -ExecutionPolicy Bypass -File tool\fetch_test_graphics.ps1 -Into build\windows\x64\runner\Debug
    - name: Runtimes beside the app and the node
      run: |
        $app = "build\windows\x64\runner\Debug"
        $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
        $debug = Get-ChildItem "$vs\VC\Redist\MSVC\*\debug_nonredist\x64\Microsoft.VC14*.DebugCRT\*.dll" | Sort-Object FullName
        $ucrt = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\ucrt\ucrtbased.dll" | Sort-Object FullName | Select-Object -Last 1
        $release = Get-ChildItem "$vs\VC\Redist\MSVC\*\x64\Microsoft.VC14*.CRT\*.dll" | Sort-Object FullName
        $debug + $ucrt | ForEach-Object { Copy-Item $_.FullName $app -Force }
        $release | ForEach-Object { Copy-Item $_.FullName build\node -Force }
        Write-Output "debug runtime beside the app: $(($debug + $ucrt).Name -join ', '); release runtime beside the node: $($release.Name -join ', ')"
    - run: dart run tool/desktop_smoke_test.dart --check-system build\windows\x64\runner\Debug
    - run: flutter test --reporter expanded tool/acceptance_test.dart

  # The packaged Linux app, as a user unpacks it: its own node starts and
  # stops with its window, a node left by a killed app is replaced, a wallet
  # is saved through the real keyring, and with the keyring locked and
  # nobody to answer, the app still starts. Its own node stays on the demo
  # network. The release builds on this: it runs this regression on the
  # tag, and packages the released app without trying it again.
  smoke-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.ref || github.sha }}
    - uses: ./.github/actions/flutter
      with:
        linux: session
    - run: flutter build linux --release --dart-define=MURMUR_LOCAL_NODE_SPEC=demo
    - run: dart run tool/bundle_node.dart
    - run: dart run tool/package_desktop.dart --tag smoke
    - run: tool/linux_session.sh dart run tool/desktop_smoke_test.dart --wallet-storage build/desktop-package/murmur-client-smoke-linux-x64
    - run: MURMUR_KEYRING=locked MURMUR_KEYRING_PROMPT_SECONDS=5 tool/linux_session.sh dart run tool/desktop_smoke_test.dart build/desktop-package/murmur-client-smoke-linux-x64

  # The packaged Mac app, the same test: murmur_client.app with its node
  # inside, signed again ad hoc (tool/package_desktop.dart; no Developer ID
  # or notarization without an Apple developer account, so no release
  # publishes it). The window is "closed" by a quit request, since pressing
  # its button from outside needs Accessibility; check 3 is reported as not
  # tried, the key store's password dialog having nobody to answer it.
  smoke-macos:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.ref || github.sha }}
    - name: The newest Xcode
      run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)" && xcodebuild -version
    - uses: ./.github/actions/flutter
    - run: flutter build macos --release --dart-define=MURMUR_LOCAL_NODE_SPEC=demo
    - run: dart run tool/bundle_node.dart
    - run: dart run tool/package_desktop.dart --tag smoke
    - run: dart run tool/desktop_smoke_test.dart --wallet-storage build/desktop-package/murmur-client-smoke-macos-universal

  # The packaged Windows app, the same test. The runner's profile is a clean
  # one, which the test needs (it refuses any other). Check 3 (the wallet
  # through Windows' data protection) is reported as not tried if Windows
  # refuses it for the runner's account.
  smoke-windows:
    runs-on: windows-latest
    # Two builds, the installer, the Store's package and its certification.
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.ref || github.sha }}
    - uses: ./.github/actions/flutter
      with:
        atl: true
    - run: flutter build windows --release --dart-define=MURMUR_LOCAL_NODE_SPEC=demo
    - run: dart run tool/bundle_node.dart
    - run: dart run tool/package_desktop.dart --tag smoke
    - uses: actions/cache@v4
      with:
        path: build/test-graphics
        key: test-graphics-${{ hashFiles('tool/fetch_test_graphics.ps1') }}
    - run: powershell -NoProfile -ExecutionPolicy Bypass -File tool\fetch_test_graphics.ps1 -Into build\desktop-package\murmur-client-smoke-windows-x64
    - run: dart run tool/desktop_smoke_test.dart --wallet-storage build\desktop-package\murmur-client-smoke-windows-x64
    # The installer the release builds (windows/installer/murmur.iss), from
    # the same folder: built, installed silently as winget does, removed.
    - run: |
        $version = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9.]+)').Matches[0].Groups[1].Value
        powershell -NoProfile -ExecutionPolicy Bypass -File tool\windows_installer.ps1 -Version $version `
          -Source build\desktop-package\murmur-client-smoke-windows-x64 -Output build\installer\murmur-client-smoke-setup.exe -Check
        if ($LASTEXITCODE -ne 0) { exit 1 }
    # The Microsoft Store's package (windows/msix/AppxManifest.xml), as the
    # release makes it: a build with MURMUR_STORE (no mining), staged without
    # murmur-miner. Packed as the Store gets it and put through the Windows
    # App Certification Kit, installed and removed; then packed again with
    # the software graphics this runner needs to draw, installed, and tried
    # as the Start menu starts it (desktop_smoke_test.dart --packaged: its
    # node beside an installer's copy's, its own folder, a notification's
    # click).
    - run: flutter build windows --release --dart-define=MURMUR_LOCAL_NODE_SPEC=demo --dart-define=MURMUR_STORE=true
    - run: dart run tool/bundle_node.dart
    - run: dart run tool/package_desktop.dart --tag smoke --store
    - run: |
        $version = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9.]+)').Matches[0].Groups[1].Value
        powershell -NoProfile -ExecutionPolicy Bypass -File tool\msix_package.ps1 -Version $version `
          -Source build\desktop-package\murmur-client-smoke-windows-x64-store -Output build\msix\murmur-client-smoke.msix -Check -Certify
        if ($LASTEXITCODE -ne 0) { exit 1 }
    - run: powershell -NoProfile -ExecutionPolicy Bypass -File tool\fetch_test_graphics.ps1 -Into build\desktop-package\murmur-client-smoke-windows-x64-store
    - run: |
        $version = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9.]+)').Matches[0].Groups[1].Value
        powershell -NoProfile -ExecutionPolicy Bypass -File tool\msix_package.ps1 -Version $version `
          -Source build\desktop-package\murmur-client-smoke-windows-x64-store -Output build\msix\murmur-client-smoke-graphics.msix `
          -Check -Smoke -AllowTestGraphics
        if ($LASTEXITCODE -ne 0) { exit 1 }
    - if: always()
      uses: actions/upload-artifact@v4
      with:
        name: msix-certification-report
        path: build/msix/*.wack.xml
        if-no-files-found: ignore
